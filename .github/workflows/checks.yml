name: checks
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        run: python -m pip install ruamel.yaml pytest
      - name: Test code generation and standalone installation
        run: python -m pytest tools/tests -q
      - name: Build native regressions with sanitizers
        run: |
          cmake -S . -B build-tests -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-tests --parallel 2
          ctest --test-dir build-tests --output-on-failure
